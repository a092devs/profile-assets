name: Refresh profile assets

# Regenerates the typing banner, tech icons and stats cards. Because the output is
# committed to this repo, a failed run simply leaves the previous assets in place
# instead of showing a broken image on the profile.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2-dev pkg-config

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow svglib reportlab rlPyCairo

      - name: Generate assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python build_assets.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh profile assets"
            git push
          fi
